<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>找回密码 · 依依不舍</title>
    <link rel="stylesheet" href="/common/common.css">
    <link rel="stylesheet" href="/auth/auth.css">
</head>
<body>
<div class="container">
    <div class="card auth-box">
        <h1>找回密码</h1>
        <p class="subtitle">输入用户名直接重置，无需邮箱/短信验证</p>
        <form id="resetForm">
            <input type="text" id="username" placeholder="用户名" required>
            <input type="password" id="newPassword" placeholder="新密码" required>
            <button type="submit">重置密码</button>
            <div class="message" id="message"></div>
        </form>
        <div class="link">想起密码了？<a href="/auth/login.html">返回登录</a></div>
    </div>
</div>
<script src="/common/http.js"></script>
<script src="/auth/reset-password.js"></script>
</body>
</html>
