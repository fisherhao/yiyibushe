spring.application.name=yiyibushe
server.port=8080

# ============ 阿里云 OSS 配置 ============
# 支持环境变量覆盖，避免在代码中硬编码密钥
aliyun.oss.endpoint=${ALIYUN_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
aliyun.oss.region=${ALIYUN_OSS_REGION:cn-hangzhou}
aliyun.oss.access-key-id=${ALIYUN_OSS_ACCESS_KEY_ID:YOUR_OSS_ACCESS_KEY_ID}
aliyun.oss.access-key-secret=${ALIYUN_OSS_ACCESS_KEY_SECRET:YOUR_OSS_ACCESS_KEY_SECRET}
aliyun.oss.bucket-name=${ALIYUN_OSS_BUCKET_NAME:YOUR_OSS_BUCKET_NAME}
# 素材在 OSS 中的统一前缀目录
aliyun.oss.asset-prefix=assets/

# ============ DashScope（通义万相）配置 ============
dashscope.base-url=https://dashscope.aliyuncs.com
dashscope.api-key=${DASHSCOPE_API_KEY:YOUR_DASHSCOPE_API_KEY}
# 文生图模型：wanx2.1-t2i-turbo（快速）/ wanx2.1-t2i-plus（高质量）
dashscope.text-to-image-model=wanx2.1-t2i-turbo
# 虚拟试衣模型
dashscope.virtual-tryon-model=wanx-virtualtryon
# 任务轮询间隔（毫秒）
dashscope.poll-interval-ms=3000
# 任务超时时间（毫秒）
dashscope.poll-timeout-ms=180000
