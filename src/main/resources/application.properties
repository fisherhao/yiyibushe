spring.application.name=yiyibushe
server.port=8080

# ============ 激活本地开发 profile ============
# 敏感配置（数据库账户、OSS 密钥等）统一放 application-dev.properties（本地文件，绝不提交）；
# 本文件只保留通用配置
spring.profiles.active=dev

# ============ DAO 持久化开关 ============
# 用户数据统一落 MySQL（注册/登录/查询全部走数据库），本地 JSON 文件实现已移除；
# 表结构统一由 Flyway 迁移脚本管理（见 db/migration）
dao.type=${DAO_TYPE:mysql}

# ============ 数据源（账户/密码等敏感项在 application-dev.properties） ============
# 连接池：日常开发 10 连接足够，空闲连接保活 60 秒
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.pool-name=YiYiBuShe-Pool

# ============ MyBatis（XML 形式 Mapper） ============
# XML 文件统一放 resources/mapper，namespace 对应 dao.mybatis 包下的 Mapper 接口
mybatis.mapper-locations=classpath:mapper/*.xml
# 数据库列 gmt_create ↔ Java 属性 gmtCreate 自动映射
mybatis.configuration.map-underscore-to-camel-case=true

# ============ Flyway 数据库版本管理 ============
# 迁移脚本目录：src/main/resources/db/migration
# 命名规则：VyyyyMMdd_HHmm__改的内容.sql（日期精确到分钟，不用横杠）
# 默认开启：应用启动时自动按版本序执行所有未应用脚本（本机需先启动 MySQL）。
# 需要临时禁用迁移时设环境变量 FLYWAY_ENABLED=false 即可。
spring.flyway.enabled=${FLYWAY_ENABLED:true}

# ============ 本地资源（文件型资源统一目录） ============
# 本地资源根目录：assets/ 存放上传图片，db/ 为本地数据文件目录
# LocalResourceManager 是唯一管理者；LocalFileUserMapper 与 LocalFileStorageService 都从它取路径
local-resource.dir=${LOCAL_RESOURCE_DIR:local-resource}

# ============ 会话配置 ============
# 服务端会话不活跃超时（秒）：超过该时长无请求自动过期，默认 2 小时（滑动续期）
# 浏览器 Cookie 有效期仍为 7 天；被踢登/改密/找回密码会立即让会话失效
session.timeout-seconds=${SESSION_TIMEOUT:7200}

# ============ 文件上传大小限制 ============
# 单张图片最大 10MB；一次最多 10 张，整包上限按 10×10MB+表单开销 设置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=110MB

# ============ 文件存储配置 ============
# storage.type：local-本地文件夹（默认，走 LocalResourceManager 的 assets 目录），oss-阿里云 OSS
storage.type=${STORAGE_TYPE:local}

# ============ 阿里云 OSS 配置（storage.type=oss 时生效） ============
# endpoint/region 等非敏感项在这里；access-key-id/secret/bucket 等密钥在 application-dev.properties
aliyun.oss.endpoint=${ALIYUN_OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
aliyun.oss.region=${ALIYUN_OSS_REGION:cn-hangzhou}
# 素材在 OSS 中的统一前缀目录
aliyun.oss.asset-prefix=assets/

# ============ 大模型凭证配置 ============
# 大模型凭证不写入配置文件，统一由 CredentialStore 管理。
# 默认 InMemoryCredentialStore 启动时从环境变量加载，支持 8 个厂商：
#   dashscope / openai / deepseek / claude / gemini / qwen / doubao / moonshot
# 每个厂商读取：
#   {PROVIDER}_APP_KEY + {PROVIDER}_APP_SECRET
# 兼容兜底：只提供 {PROVIDER}_API_KEY 时，appKey 可空、appSecret 取该值。
# 例如：DASHSCOPE_APP_KEY / DASHSCOPE_APP_SECRET，或 DEEPSEEK_API_KEY。
# 也可通过 AiPlatformService#connectAndChat 运行时传入 appKey/appSecret 直连。
# 未来可替换为 Redis / MySQL 实现的 CredentialStore。
# 模型定义（厂商、端点、模型名、协议）统一在 ModelRegistry 中注册。
